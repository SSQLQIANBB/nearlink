[package]
name = "todesk-desktop"
default-run = "todesk-desktop"
version = "0.6.0-beta.4"
description = "ToDesk desktop client for Windows and macOS"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
libc = "0.2"
tauri-build = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ed25519-dalek = "=2.1.1"
getrandom = "0.2"
sha2 = "0.10"
hmac = "0.12"
libc = "0.2"
zeroize = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[features]
remote-control-harness = []

[[bin]]
name = "remote-control-host-harness"
path = "src/remote_control_host_harness.rs"
required-features = ["remote-control-harness"]

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString", "NSGeometry", "NSObject", "NSTimer", "NSRunLoop", "block2"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSAlert", "NSApplication", "NSButton", "NSCell", "NSControl", "NSResponder", "NSView", "NSWindow", "NSPanel", "NSBox", "NSColor", "NSFont", "NSText", "NSTextField", "NSGraphics", "block2"] }
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
