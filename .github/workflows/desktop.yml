name: Desktop Build

on:
  push:
    branches: ['feature/desktop-tauri']
  workflow_dispatch:
    inputs:
      server_url:
        description: '已部署服务地址，例如 https://www.example.com（不含 /api）'
        required: true
        type: string
  workflow_call:
    inputs:
      server_url:
        required: false
        type: string
  pull_request:
    paths:
      - 'client-vue/**'
      - 'pnpm-lock.yaml'
      - 'scripts/desktop-release*.mjs'
      - 'scripts/product-version*.mjs'
      - 'package.json'
      - 'backend-koa/package.json'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/desktop-release.yml'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
          - platform: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-x64
            runner: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      VITE_API_BASE_URL: ${{ inputs.server_url || vars.DESKTOP_SERVER_URL || 'https://www.sycsq.top' }}
      VITE_SOCKET_URL: ${{ inputs.server_url || vars.DESKTOP_SERVER_URL || 'https://www.sycsq.top' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-vue/src-tauri -> target
      - run: node scripts/product-version.mjs check
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/product-version.test.mjs scripts/desktop-release.test.mjs
      - run: pnpm --filter client-vue test
      - run: cargo check --locked --manifest-path client-vue/src-tauri/Cargo.toml
      - run: pnpm --filter client-vue desktop:build ${{ matrix.args }}
      - name: Build native test binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # WebView2 150+ ignores debugging environment variables on elevated runners.
          # Build the test binary separately; the already bundled installer stays unchanged.
          $config = Get-Content client-vue/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $config.app.windows[0] | Add-Member additionalBrowserArgs '--remote-debugging-port=9222'
          $config.app.windows[0] | Add-Member dataDirectory 'native-test'
          $testConfig = Join-Path $env:RUNNER_TEMP 'todesk-test-config.json'
          @{ app = @{ windows = $config.app.windows } } | ConvertTo-Json -Depth 10 | Set-Content $testConfig
          pnpm --filter client-vue exec tauri build --no-bundle --config $testConfig
      - run: pnpm --filter client-vue exec playwright test --config playwright.native.config.ts
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: NearLink-${{ matrix.platform }}
          path: |
            client-vue/src-tauri/target/release/bundle/nsis/*.exe
            client-vue/src-tauri/target/*/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: Windows-validation
          path: |
            client-vue/test-results/**/windows-login.png
            client-vue/test-results/**/error-context.md
            client-vue/src-tauri/Cargo.lock
