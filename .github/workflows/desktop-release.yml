name: Desktop Release

on:
  push:
    tags: ['desktop-v*']

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/product-version.test.mjs scripts/desktop-release.test.mjs
      - id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/desktop-release.mjs "$RELEASE_TAG"

  build:
    needs: validate
    uses: ./.github/workflows/desktop.yml

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: NearLink-*
          path: artifacts
          merge-multiple: true
      - name: Verify installers and create checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' \) -exec cp {} release-assets/ \;
          test "$(find release-assets -name '*.exe' | wc -l)" -eq 1
          test "$(find release-assets -name '*.dmg' | wc -l)" -eq 2
          cd release-assets
          sha256sum -- *.exe *.dmg > SHA256SUMS.txt
      - name: Publish complete release
        shell: bash
        run: |
          set -euo pipefail
          node scripts/desktop-release-notes.mjs > release-notes.md
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            node -e 'if (!JSON.parse(require("fs").readFileSync("release-state.json")).isDraft) throw Error("该版本已发布，请使用新版本号")'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "NearLink 内测版 v${RELEASE_VERSION}" \
              --notes-file release-notes.md --generate-notes
          fi
          gh release upload "$RELEASE_TAG" --clobber \
            "release-assets/NearLink_${RELEASE_VERSION}_x64-setup.exe#Windows 安装包（64 位 Intel / AMD）.exe" \
            "release-assets/NearLink_${RELEASE_VERSION}_aarch64.dmg#macOS 安装包（Apple 芯片 / M 系列）.dmg" \
            "release-assets/NearLink_${RELEASE_VERSION}_x64.dmg#macOS 安装包（Intel 芯片）.dmg" \
            "release-assets/SHA256SUMS.txt#SHA-256 校验文件（不是安装包）"
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"
